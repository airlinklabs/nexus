[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm build:bot && pnpm --filter dashboard build"

[deploy]
startCommand = "node packages/bot/dist/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/health"
healthcheckTimeout = 10

[volumes]
mountPath = "/data"

[[services]]
name = "nexus-bot"
